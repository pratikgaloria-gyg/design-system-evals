<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Onboarding carousel</title>
</head>
<body>
  <section class="card" id="carousel" role="region" aria-roledescription="carousel" aria-label="Welcome to GetYourGuide">
    <div class="step-indicator">
      <div class="dots" role="group" aria-label="Step 1 of 3">
        <span class="hit"><button class="dot" aria-label="Go to step 1" aria-current="step"></button></span>
        <span class="hit"><button class="dot" aria-label="Go to step 2"></button></span>
        <span class="hit"><button class="dot" aria-label="Go to step 3"></button></span>
      </div>
      <span class="t-text-regular-xs" aria-hidden="true">1 of 3</span>
    </div>
    <div class="illustration" aria-hidden="true">
      <img src="assets/icons/pin-on-map.svg" alt="">
    </div>
    <div class="text" aria-live="polite">
      <h2 class="t-heading-md">Your next adventure starts here</h2>
      <p class="t-text-regular-sm">Find tours, tickets and experiences wherever you travel.</p>
    </div>
    <div class="actions">
      <button class="c-button c-button--filled c-button--large">Next</button>
      <button class="c-button c-button--text c-button--medium">Skip</button>
    </div>
  </section>
</body>
</html>
